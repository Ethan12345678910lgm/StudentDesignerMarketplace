spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:marketplace;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:NewStrongPassword!234}

# JPA/Hibernate configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=myVerySecureJwtSecretKeyThatIsAtLeast256BitsLongAndShouldBeChangedInProduction12345678
app.jwt.expiration-ms=86400000

# Server configuration
server.servlet.context-path=/StudentDesignerMarketplace
server.port=8080

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.za.ac.cput=DEBUG
logging.level.org.springframework.web=DEBUG
